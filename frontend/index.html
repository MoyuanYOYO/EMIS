<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教务管理系统 - 登录</title>
    <!-- 本地 Bootstrap 5 CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            background: #4a6ee0;
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }

        .login-body {
            padding: 30px;
        }

        .btn-login {
            background: #4a6ee0;
            border: none;
            padding: 10px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #3a5ed0;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <h3 class="mb-2">🎓 教务管理系统</h3>
            <p class="mb-0">安全、高效、便捷</p>
        </div>
        <div class="login-body">
            <h5 class="text-center mb-4">用户登录</h5>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required
                        autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码"
                        required>
                </div>
                <button type="submit" class="btn btn-login w-100 text-white mt-3">登录</button>
            </form>

            <div id="message" class="mt-3"></div>

            <div class="mt-4">
                <h6 class="text-muted mb-2">测试账户：</h6>
                <div class="alert alert-info small mb-0">
                    <div><strong>学生</strong>: zhangsan / 123456</div>
                    <div><strong>教师</strong>: huang_prof / 123456</div>
                    <div><strong>管理员</strong>: admin / 123456</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 本地 Bootstrap 5 JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <!-- 公共工具 -->
    <script src="/js/common.js"></script>

    <!-- 登录逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.getElementById('loginForm');
            const messageDiv = document.getElementById('message');

            // 检查是否已登录
            checkLoginStatus();

            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    showMessage('用户名和密码不能为空', 'danger');
                    return;
                }

                // 显示加载状态
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = '登录中...';
                submitBtn.disabled = true;

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // 登录成功，根据角色跳转
                        showMessage('登录成功！正在跳转...', 'success');

                        setTimeout(() => {
                            if (data.role === 'student') {
                                window.location.href = '/student/dashboard';
                            } else if (data.role === 'teacher') {
                                window.location.href = '/teacher/dashboard';
                            } else if (data.role === 'admin') {
                                window.location.href = '/admin/dashboard';
                            } else {
                                window.location.href = '/';
                            }
                        }, 1000);
                    } else {
                        showMessage(data.error || '登录失败', 'danger');
                    }
                } catch (error) {
                    showMessage('网络错误，请检查服务器连接', 'danger');
                } finally {
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            });

            function showMessage(message, type) {
                messageDiv.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                `;
            }
        });

        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/auth/current-user');
                if (response.ok) {
                    const result = await response.json();

                    // 检查是否返回了有效数据
                    if (result && result.role) {
                        // 根据角色直接跳转到对应的仪表板
                        if (result.role === 'student') {
                            window.location.href = '/student/dashboard';
                        } else if (result.role === 'teacher') {
                            window.location.href = '/teacher/dashboard';
                        } else if (result.role === 'admin') {
                            window.location.href = '/admin/dashboard';
                        }
                    }
                }
                // 如果未登录，就停留在登录页面，不执行任何跳转
            } catch (error) {
                // 网络错误或未登录，停留在登录页面
                console.log('用户未登录，显示登录表单');
            }
        }
    </script>
</body>

</html>
