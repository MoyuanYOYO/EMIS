<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生仪表板 - 教务管理系统</title>
    <!-- 本地 Bootstrap 5 CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- 通用工具 -->
    <script src="/js/common.js"></script>
    <!-- 自定义CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        /* 修复Bootstrap source map警告 */
        /* 这些.map文件用于开发调试，不影响功能 */
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="#">
                🎓 教务管理系统 - 学生端
            </a>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted" id="studentName">加载中...</span>
                <a href="/api/auth/logout" class="btn btn-outline-secondary btn-sm">
                    注销
                </a>
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container-fluid mt-3">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-lg-2 col-md-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <ul class="nav flex-column" id="sidebarMenu">
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="dashboard">
                                    仪表板
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="profile">
                                    个人资料
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="courses">
                                    已选课程
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="enrollment">
                                    选课中心
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="grades">
                                    成绩查询
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 主要内容区 -->
            <div class="col-lg-10 col-md-9">
                <div class="card">
                    <div class="card-body" id="mainContent">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-3">正在加载学生仪表板...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 本地 Bootstrap 5 JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>

    <!-- 学生仪表板逻辑 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 检查登录状态
            checkLoginStatus();

            // 初始化页面
            initializePage();
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/auth/current-user');

                if (!response.ok) {
                    // 未登录或会话过期，跳转到登录页面
                    window.location.href = '/';
                    return;
                }

                const user = await response.json();

                // 检查是否为有效用户
                if (!user || !user.user_id) {
                    window.location.href = '/';
                    return;
                }

                // 检查角色 - 如果是学生，继续；否则跳转到对应页面
                if (user.role === 'student') {
                    // 显示学生姓名
                    document.getElementById('studentName').textContent = user.name || user.username || '学生';
                } else {
                    // 根据角色跳转到对应页面
                    if (user.role === 'teacher') {
                        window.location.href = '/teacher/dashboard';
                    } else if (user.role === 'admin') {
                        window.location.href = '/admin/dashboard';
                    } else {
                        // 未知角色，跳转到登录页面
                        window.location.href = '/';
                    }
                    return;
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                window.location.href = '/';
            }
        }

        // 初始化页面
        function initializePage() {
            // 设置侧边栏按钮点击事件
            const sidebarButtons = document.querySelectorAll('#sidebarMenu button');
            sidebarButtons.forEach(button => {
                button.addEventListener('click', function () {
                    // 移除所有按钮的active状态
                    sidebarButtons.forEach(btn => {
                        btn.classList.remove('active', 'btn-primary');
                        btn.classList.add('btn-outline-primary');
                    });

                    // 设置当前按钮为active状态
                    this.classList.remove('btn-outline-primary');
                    this.classList.add('active', 'btn-primary');

                    // 加载对应页面
                    const page = this.dataset.page;
                    loadPage(page);
                });
            });

            // 默认加载仪表板
            loadPage('dashboard');
        }

        // 加载页面
        async function loadPage(page) {
            const mainContent = document.getElementById('mainContent');

            // 显示加载状态
            mainContent.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-3">正在加载...</p>
                </div>
            `;

            try {
                switch (page) {
                    case 'dashboard':
                        await loadDashboard();
                        break;
                    case 'profile':
                        await loadProfile();
                        break;
                    case 'courses':
                        await loadCourses();
                        break;
                    case 'enrollment':
                        await loadEnrollment();
                        break;
                    case 'grades':
                        await loadGrades();
                        break;
                    default:
                        await loadDashboard();
                }
            } catch (error) {
                console.error('加载页面失败:', error);
                showError('加载页面失败，请刷新重试: ' + error.message);
            }
        }

        // 显示错误信息
        function showError(message) {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="alert alert-danger">
                    <h5 class="alert-heading">错误</h5>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="location.reload()">刷新页面</button>
                    <button class="btn btn-secondary ms-2" onclick="loadPage('dashboard')">返回首页</button>
                </div>
            `;
        }

        // 显示成功信息
        function showSuccess(message) {
            const mainContent = document.getElementById('mainContent');
            const currentContent = mainContent.innerHTML;
            mainContent.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                ${currentContent}
            `;
        }

        // 加载仪表板
        async function loadDashboard() {
            try {
                // 获取学生信息
                const studentResponse = await fetch('/api/auth/current-user');
                if (!studentResponse.ok) {
                    throw new Error('获取学生信息失败');
                }

                const student = await studentResponse.json();

                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = `
                    <h4 class="mb-4">学生仪表板</h4>
                    
                    <div class="alert alert-info">
                        <strong>欢迎回来，${student.name || student.username || '同学'}！</strong>
                        <p class="mb-0 mt-2">请使用侧边栏菜单管理您的学习任务。</p>
                    </div>
                    
                    <div class="row mt-4">
                        <div class="col-md-6 mb-4">
                            <div class="card h-100">
                                <div class="card-header bg-primary text-white">
                                    <h5 class="mb-0">快速操作</h5>
                                </div>
                                <div class="card-body">
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-outline-primary" data-page="enrollment">
                                            选课中心
                                        </button>
                                        <button class="btn btn-outline-success" data-page="grades">
                                            查看成绩
                                        </button>
                                        <button class="btn btn-outline-info" data-page="courses">
                                            已选课程
                                        </button>
                                        <button class="btn btn-outline-warning" data-page="profile">
                                            个人资料
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6 mb-4">
                            <div class="card h-100">
                                <div class="card-header bg-success text-white">
                                    <h5 class="mb-0">系统提示</h5>
                                </div>
                                <div class="card-body">
                                    <ul class="list-group list-group-flush">
                                        <li class="list-group-item">
                                            请在规定时间内完成选课操作
                                        </li>
                                        <li class="list-group-item">
                                            注意查看课程时间安排，避免冲突
                                        </li>
                                        <li class="list-group-item">
                                            及时核对个人信息，如有错误请联系管理员
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mt-4">
                        <div class="card-header">
                            <h5 class="mb-0">通知公告</h5>
                        </div>
                        <div class="card-body">
                            <div class="text-center text-muted">
                                <p>暂无通知</p>
                            </div>
                        </div>
                    </div>
                `;

                // 为快速操作按钮添加点击事件
                mainContent.querySelectorAll('[data-page]').forEach(button => {
                    button.addEventListener('click', function () {
                        const page = this.dataset.page;
                        loadPage(page);
                    });
                });
            } catch (error) {
                throw error;
            }
        }

        // 加载个人资料
        async function loadProfile() {
            try {
                const response = await fetch('/api/student/profile');
                if (!response.ok) {
                    throw new Error('获取个人资料失败');
                }

                const result = await response.json();
                let profile;

                // 兼容新旧API格式
                if (result.success !== undefined) {
                    // 新格式：有success字段
                    if (!result.success) {
                        throw new Error(result.error || '获取个人资料失败');
                    }
                    profile = result.data;
                } else {
                    // 旧格式：直接返回数据
                    profile = result;
                }

                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4>个人资料</h4>
                        <button class="btn btn-primary" onclick="editProfile()">编辑资料</button>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label text-muted">学号</label>
                                        <p class="fs-5">${profile.student_id || '未设置'}</p>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">姓名</label>
                                        <p class="fs-5">${profile.name || '未设置'}</p>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">性别</label>
                                        <p class="fs-5">${profile.gender || '未设置'}</p>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">出生日期</label>
                                        <p class="fs-5">${profile.birth_date ? formatDate(profile.birth_date) : '未设置'}</p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label text-muted">院系</label>
                                        <p class="fs-5">${profile.department || '未设置'}</p>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">专业</label>
                                        <p class="fs-5">${profile.major || '未设置'}</p>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">邮箱</label>
                                        <p class="fs-5">${profile.email || '未设置'}</p>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-muted">入学年份</label>
                                        <p class="fs-5">${profile.enrollment_year || '未设置'}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label text-muted">身份证号</label>
                                        <p class="fs-5">${profile.id_card ? maskIdCard(profile.id_card) : '已加密'}</p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label text-muted">手机号</label>
                                        <p class="fs-5">${profile.phone ? maskPhone(profile.phone) : '已加密'}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="alert alert-info mt-3">
                                <strong>注意：</strong>身份证号和手机号等敏感信息已加密存储，保护您的隐私安全。
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                throw error;
            }
        }

        // 编辑个人资料
        async function editProfile() {
            try {
                const response = await fetch('/api/student/profile');
                if (!response.ok) {
                    throw new Error('获取个人资料失败');
                }

                const result = await response.json();
                let profile;

                if (result.success !== undefined) {
                    if (!result.success) throw new Error(result.error);
                    profile = result.data;
                } else {
                    profile = result;
                }

                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4>编辑个人资料</h4>
                        <button class="btn btn-secondary" onclick="loadPage('profile')">取消</button>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <form id="editProfileForm">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">学号</label>
                                            <input type="text" class="form-control" value="${profile.student_id || ''}" disabled>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">姓名</label>
                                            <input type="text" class="form-control" value="${profile.name || ''}" disabled>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">邮箱</label>
                                            <input type="email" class="form-control" id="email" value="${profile.email || ''}">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">手机号</label>
                                            <input type="tel" class="form-control" id="phone" value="${profile.phone || ''}">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="alert alert-warning mt-3">
                                    <strong>提示：</strong>姓名、学号等核心信息不可修改，请联系管理员进行更改。
                                </div>
                                
                                <div class="mt-4">
                                    <button type="submit" class="btn btn-primary">保存更改</button>
                                    <button type="button" class="btn btn-secondary" onclick="loadPage('profile')">取消</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;

                // 设置表单提交事件
                document.getElementById('editProfileForm').addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const email = document.getElementById('email').value;
                    const phone = document.getElementById('phone').value;

                    try {
                        const response = await fetch('/api/student/profile', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, phone })
                        });

                        const result = await response.json();

                        if (response.ok) {
                            let success = false;
                            let message = '';

                            if (result.success !== undefined) {
                                success = result.success;
                                message = result.message || result.error;
                            } else {
                                success = true;
                                message = '更新成功';
                            }

                            if (success) {
                                showSuccess('个人信息更新成功！');
                                setTimeout(() => loadPage('profile'), 1000);
                            } else {
                                alert('更新失败：' + message);
                            }
                        } else {
                            alert('更新失败：' + (result.error || '未知错误'));
                        }
                    } catch (error) {
                        alert('网络错误，请稍后重试');
                    }
                });
            } catch (error) {
                alert('加载编辑表单失败：' + error.message);
                loadPage('profile');
            }
        }

        // 加载已选课程
        async function loadCourses() {
            try {
                const response = await fetch('/api/student/courses/enrolled');
                if (!response.ok) {
                    throw new Error('获取已选课程失败');
                }

                const result = await response.json();
                let courses;

                // 兼容新旧API格式
                if (result.success !== undefined) {
                    if (!result.success) {
                        throw new Error(result.error);
                    }
                    courses = result.data || [];
                } else {
                    courses = result || [];
                }

                const mainContent = document.getElementById('mainContent');

                let coursesHTML = '';
                if (courses.length > 0) {
                    coursesHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>课程名称</th>
                                        <th>课程号</th>
                                        <th>学分</th>
                                        <th>教师</th>
                                        <th>选课时间</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${courses.map(course => `
                                        <tr>
                                            <td>${course.course_name || course.course_name || '未知课程'}</td>
                                            <td>${course.course_id || '未知'}</td>
                                            <td>${course.credits || '0'}</td>
                                            <td>${course.teacher_name || '未分配'}</td>
                                            <td>${course.enroll_time ? formatDate(course.enroll_time) : '-'}</td>
                                            <td>
                                                <span class="badge ${(course.status === 'enrolled') ? 'bg-success' : (course.status === 'dropped') ? 'bg-warning' : 'bg-secondary'}">
                                                    ${course.status === 'enrolled' ? '已选' : course.status === 'dropped' ? '已退' : course.status || '未知'}
                                                </span>
                                            </td>
                                            <td>
                                                ${(course.status === 'enrolled') ? `
                                                    <button class="btn btn-sm btn-danger" onclick="dropCourse(${course.enrollment_id || 0}, '${course.course_name || course.course_id}')">
                                                        退选
                                                    </button>
                                                ` : '<span class="text-muted">不可操作</span>'}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    coursesHTML = `
                        <div class="alert alert-warning">
                            当前没有已选课程，请前往选课中心选择课程。
                        </div>
                    `;
                }

                mainContent.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4>已选课程</h4>
                        <div>
                            <button class="btn btn-outline-primary" onclick="loadPage('enrollment')">去选课</button>
                            <button class="btn btn-outline-secondary ms-2" onclick="loadCourses()">刷新</button>
                        </div>
                    </div>
                    
                    ${coursesHTML}
                `;
            } catch (error) {
                throw error;
            }
        }

        // 退选课程
        async function dropCourse(enrollmentId, courseName) {
            if (!enrollmentId || enrollmentId === 0) {
                alert('无效的课程ID');
                return;
            }

            if (!confirm(`确定要退选课程 "${courseName}" 吗？`)) return;

            try {
                // 尝试新API端点
                let response = await fetch(`/api/student/enrollments/${enrollmentId}/drop`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                // 如果新API端点不存在，尝试旧API端点
                if (response.status === 404) {
                    response = await fetch(`/api/student/courses/drop/${enrollmentId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                }

                const result = await response.json();

                if (response.ok) {
                    let success = false;
                    let message = '';

                    if (result.success !== undefined) {
                        success = result.success;
                        message = result.message || result.error;
                    } else {
                        success = true;
                        message = '退选成功';
                    }

                    if (success) {
                        alert('退选成功！');
                        loadCourses();
                    } else {
                        alert('退选失败：' + message);
                    }
                } else {
                    alert('退选失败：' + (result.error || '未知错误'));
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        }

        // 加载选课中心
        async function loadEnrollment() {
            try {
                const [availableRes, enrolledRes] = await Promise.all([
                    fetch('/api/student/courses'),
                    fetch('/api/student/courses/enrolled')
                ]);

                let available = [];
                if (availableRes.ok) {
                    const result = await availableRes.json();
                    if (result.success !== undefined) {
                        available = result.success ? (result.data || []) : [];
                    } else {
                        available = result || [];
                    }
                }

                let enrolled = [];
                if (enrolledRes.ok) {
                    const result = await enrolledRes.json();
                    if (result.success !== undefined) {
                        enrolled = result.success ? (result.data || []) : [];
                    } else {
                        enrolled = result || [];
                    }
                }

                const mainContent = document.getElementById('mainContent');

                let availableHTML = '';
                if (available.length > 0) {
                    availableHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>课程名称</th>
                                        <th>课程号</th>
                                        <th>学分</th>
                                        <th>类型</th>
                                        <th>教师</th>
                                        <th>剩余名额</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${available.map(course => {
                        const currentEnrollment = course.current_enrollment || 0;
                        const capacity = course.capacity || 50;
                        const availableSeats = capacity - currentEnrollment;
                        const courseType = course.type || 'elective';
                        const typeName = courseType === 'compulsory' ? '必修' :
                            courseType === 'elective' ? '选修' : '通识';

                        return `
                                            <tr>
                                                <td>
                                                    <strong>${course.course_name || '未知课程'}</strong><br>
                                                    <small class="text-muted">${course.description || '无描述'}</small>
                                                </td>
                                                <td>${course.course_id || '未知'}</td>
                                                <td>${course.credits || '0'}</td>
                                                <td>
                                                    <span class="badge ${courseType === 'compulsory' ? 'bg-primary' : courseType === 'elective' ? 'bg-success' : 'bg-info'}">
                                                        ${typeName}
                                                    </span>
                                                </td>
                                                <td>${course.teacher_name || '未分配'}</td>
                                                <td>${availableSeats}</td>
                                                <td>
                                                    <button class="btn btn-sm btn-success" 
                                                            onclick="enrollCourse('${course.course_id || ''}', '${course.course_name || '未知课程'}')">
                                                        选课
                                                    </button>
                                                </td>
                                            </tr>
                                        `;
                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    availableHTML = `
                        <div class="alert alert-warning">
                            当前无可选课程，或所有课程都已达到容量上限。
                        </div>
                    `;
                }

                let enrolledHTML = '';
                if (enrolled.length > 0) {
                    enrolledHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>课程名称</th>
                                        <th>课程号</th>
                                        <th>学分</th>
                                        <th>教师</th>
                                        <th>选课时间</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${enrolled.map(course => `
                                        <tr>
                                            <td>${course.course_name || '未知课程'}</td>
                                            <td>${course.course_id || '未知'}</td>
                                            <td>${course.credits || '0'}</td>
                                            <td>${course.teacher_name || '未分配'}</td>
                                            <td>${course.enroll_time ? formatDate(course.enroll_time) : '-'}</td>
                                            <td>
                                                <span class="badge ${course.status === 'enrolled' ? 'bg-success' : 'bg-warning'}">
                                                    ${course.status === 'enrolled' ? '已选' : '已退'}
                                                </span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    enrolledHTML = `
                        <div class="alert alert-info">
                            当前未选择任何课程。
                        </div>
                    `;
                }

                mainContent.innerHTML = `
                    <h4 class="mb-4">选课中心</h4>
                    
                    <ul class="nav nav-tabs mb-4" id="enrollmentTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="available-tab" data-bs-toggle="tab" data-bs-target="#available" type="button" role="tab">
                                可选课程 (${available.length})
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="enrolled-tab" data-bs-toggle="tab" data-bs-target="#enrolled" type="button" role="tab">
                                已选课程 (${enrolled.length})
                            </button>
                        </li>
                    </ul>
                    
                    <div class="tab-content" id="enrollmentTabsContent">
                        <div class="tab-pane fade show active" id="available" role="tabpanel">
                            ${availableHTML}
                        </div>
                        <div class="tab-pane fade" id="enrolled" role="tabpanel">
                            ${enrolledHTML}
                        </div>
                    </div>
                    
                    <div class="alert alert-info mt-3">
                        <strong>选课说明：</strong>
                        <ul class="mb-0">
                            <li>请仔细阅读课程描述和上课时间，避免课程冲突</li>
                            <li>选课后如需调整，请在规定时间内完成退选操作</li>
                            <li>如有任何问题，请联系所在院系的教务老师</li>
                        </ul>
                    </div>
                `;

                // 初始化Bootstrap标签页
                if (typeof bootstrap !== 'undefined') {
                    const tabEl = document.querySelector('#enrollmentTabs button');
                    if (tabEl) {
                        const tab = new bootstrap.Tab(tabEl);
                        tab.show();
                    }
                }
            } catch (error) {
                throw error;
            }
        }

        // 选课
        async function enrollCourse(courseId, courseName) {
            if (!courseId) {
                alert('无效的课程ID');
                return;
            }

            if (!confirm(`确定要选择课程 "${courseName}" 吗？`)) return;

            try {
                // 尝试新API端点
                let response = await fetch(`/api/student/courses/${courseId}/enroll`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                // 如果新API端点不存在，尝试旧API端点
                if (response.status === 404) {
                    response = await fetch('/api/student/courses/enroll', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ course_id: courseId })
                    });
                }

                const result = await response.json();

                if (response.ok) {
                    let success = false;
                    let message = '';

                    if (result.success !== undefined) {
                        success = result.success;
                        message = result.message || result.error;
                    } else {
                        success = true;
                        message = '选课成功';
                    }

                    if (success) {
                        alert('选课成功！');
                        loadEnrollment();
                    } else {
                        alert('选课失败：' + message);
                    }
                } else {
                    alert('选课失败：' + (result.error || '未知错误'));
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        }

        // 加载成绩查询
        async function loadGrades() {
            try {
                const response = await fetch('/api/student/grades');
                if (!response.ok) {
                    throw new Error('获取成绩失败');
                }

                const result = await response.json();
                let grades;
                let statistics = {};

                // 兼容新旧API格式
                if (result.success !== undefined) {
                    // 新格式
                    if (!result.success) {
                        throw new Error(result.error);
                    }
                    grades = result.data?.grades || result.data || [];
                    statistics = result.data?.statistics || {};
                } else {
                    // 旧格式
                    grades = result || [];
                }

                const mainContent = document.getElementById('mainContent');

                let gradesHTML = '';
                if (grades.length > 0) {
                    // 计算统计信息（如果后端没有提供）
                    if (Object.keys(statistics).length === 0) {
                        const coursesWithGrades = grades.filter(g => g.grade).length;
                        const totalCredits = grades.filter(g => g.grade).reduce((sum, g) => sum + (g.credits || 0), 0);
                        const totalGrade = grades.filter(g => g.grade).reduce((sum, g) => sum + (g.grade || 0), 0);
                        const averageGrade = coursesWithGrades > 0 ? (totalGrade / coursesWithGrades).toFixed(2) : 0;

                        statistics = {
                            courses_with_grades: coursesWithGrades,
                            total_credits: totalCredits,
                            average_grade: averageGrade,
                            gpa: averageGrade // 简化计算
                        };
                    }

                    gradesHTML = `
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>课程名称</th>
                                        <th>课程号</th>
                                        <th>学分</th>
                                        <th>平时成绩</th>
                                        <th>期末成绩</th>
                                        <th>总成绩</th>
                                        <th>状态</th>
                                        <th>完整性验证</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${grades.map(grade => {
                        const integrityVerified = grade.integrity_verified !== false;
                        const verificationText = integrityVerified ? '✓ 已验证' : '⚠ 未验证';
                        const verificationClass = integrityVerified ? 'bg-success' : 'bg-warning';
                        const statusText = grade.status === 'completed' ? '已修' :
                            grade.status === 'enrolled' ? '在读' : '已退';
                        const statusClass = grade.status === 'completed' ? 'bg-success' : 'bg-info';

                        return `
                                            <tr>
                                                <td>${grade.course_name || '未知课程'}</td>
                                                <td>${grade.course_id || '未知'}</td>
                                                <td>${grade.credits || '0'}</td>
                                                <td>${grade.regular_score || '-'}</td>
                                                <td>${grade.final_score || '-'}</td>
                                                <td>
                                                    ${grade.grade ? `<strong>${grade.grade}</strong>` : '-'}
                                                </td>
                                                <td>
                                                    <span class="badge ${statusClass}">
                                                        ${statusText}
                                                    </span>
                                                </td>
                                                <td>
                                                    <span class="badge ${verificationClass}">
                                                        ${verificationText}
                                                    </span>
                                                </td>
                                            </tr>
                                        `;
                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="alert alert-success mt-3">
                            <strong>成绩完整性保护说明：</strong>
                            <ul class="mb-0">
                                <li>系统使用加密哈希算法保护您的成绩数据</li>
                                <li>✓ 已验证：成绩未被篡改，数据完整可信</li>
                                <li>⚠ 未验证：成绩数据可能存在问题，请联系教师确认</li>
                            </ul>
                        </div>
                    `;
                } else {
                    gradesHTML = `
                        <div class="alert alert-warning">
                            暂无成绩信息。
                        </div>
                    `;
                }

                mainContent.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4>成绩查询</h4>
                        <button class="btn btn-outline-secondary" onclick="loadGrades()">刷新</button>
                    </div>
                    
                    ${gradesHTML}
                    
                    <div class="card mt-4">
                        <div class="card-header">
                            <h5 class="mb-0">成绩统计</h5>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-md-3">
                                    <h3>${statistics.courses_with_grades || 0}</h3>
                                    <p class="text-muted">已有成绩课程</p>
                                </div>
                                <div class="col-md-3">
                                    <h3>${statistics.total_credits || 0}</h3>
                                    <p class="text-muted">已获学分</p>
                                </div>
                                <div class="col-md-3">
                                    <h3>${statistics.average_grade ? parseFloat(statistics.average_grade).toFixed(2) : '0.00'}</h3>
                                    <p class="text-muted">平均成绩</p>
                                </div>
                                <div class="col-md-3">
                                    <h3>${statistics.gpa ? parseFloat(statistics.gpa).toFixed(2) : '0.00'}</h3>
                                    <p class="text-muted">平均绩点</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                throw error;
            }
        }

        // 工具函数
        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('zh-CN');
            } catch (e) {
                return dateString;
            }
        }

        function maskIdCard(idCard) {
            if (!idCard || idCard.length < 15) return idCard;
            return idCard.substring(0, 6) + '********' + idCard.substring(idCard.length - 4);
        }

        function maskPhone(phone) {
            if (!phone || phone.length < 11) return phone;
            return phone.substring(0, 3) + '****' + phone.substring(phone.length - 4);
        }
    </script>
</body>

</html>
