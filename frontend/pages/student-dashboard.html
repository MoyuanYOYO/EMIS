<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生仪表板 - 教务管理系统</title>
    <!-- 本地 Bootstrap 5 CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义CSS -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        /* 一些简单的内联样式 */
        .status-badge {
            font-size: 0.8em;
            padding: 4px 8px;
        }

        .course-card {
            transition: transform 0.2s;
            cursor: pointer;
        }

        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .nav-link.active {
            font-weight: bold;
        }

        /* 加载动画样式 */
        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="#">
                🎓 教务管理系统 - 学生端
            </a>
            <div class="d-flex align-items-center">
                <span class="me-3 text-muted" id="studentName">加载中...</span>
                <button class="btn btn-outline-secondary btn-sm" onclick="studentDashboard.logout()">
                    <span class="loading-spinner" id="logoutSpinner" style="display: none;"></span>
                    注销
                </button>
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container-fluid mt-3">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-lg-2 col-md-3 mb-3">
                <div class="card">
                    <div class="card-body">
                        <ul class="nav flex-column" id="sidebarMenu">
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="dashboard">
                                    <i class="bi bi-house"></i> 仪表板
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="profile">
                                    <i class="bi bi-person"></i> 个人资料
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="courses">
                                    <i class="bi bi-book"></i> 已选课程
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="enrollment">
                                    <i class="bi bi-plus-circle"></i> 选课中心
                                </button>
                            </li>
                            <li class="nav-item mb-2">
                                <button class="btn btn-outline-primary w-100 text-start" data-page="grades">
                                    <i class="bi bi-clipboard-data"></i> 成绩查询
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- 学生信息卡片 -->
                <div class="card mt-3 d-none d-md-block">
                    <div class="card-body p-3">
                        <div class="d-flex align-items-center">
                            <div class="flex-shrink-0">
                                <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center"
                                    style="width: 40px; height: 40px;">
                                    <span class="text-white fw-bold">学</span>
                                </div>
                            </div>
                            <div class="flex-grow-1 ms-3">
                                <h6 class="mb-0" id="sidebarStudentName">...</h6>
                                <small class="text-muted" id="sidebarStudentId">...</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主要内容区 -->
            <div class="col-lg-10 col-md-9">
                <div class="card">
                    <div class="card-header bg-light">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0" id="breadcrumb">
                                <li class="breadcrumb-item active">仪表板</li>
                            </ol>
                        </nav>
                    </div>
                    <div class="card-body" id="mainContent">
                        <!-- 内容将由JavaScript动态加载 -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-3">正在加载学生仪表板...</p>
                        </div>
                    </div>
                </div>

                <!-- 系统信息栏 -->
                <div class="card mt-3">
                    <div class="card-body p-2">
                        <div class="row text-center">
                            <div class="col">
                                <small class="text-muted">
                                    <i class="bi bi-shield-check"></i> 系统安全状态：正常
                                </small>
                            </div>
                            <div class="col">
                                <small class="text-muted">
                                    <i class="bi bi-clock"></i> 最后更新：<span id="lastUpdateTime">刚刚</span>
                                </small>
                            </div>
                            <div class="col">
                                <small class="text-muted">
                                    <i class="bi bi-info-circle"></i> 技术支持：EMIS 教务管理系统
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息容器（用于显示临时消息） -->
    <div id="messageContainer" style="position: fixed; top: 70px; right: 20px; z-index: 1050; max-width: 350px;"></div>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- JavaScript 文件 -->
    <!-- Bootstrap 5 JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>

    <!-- 公共工具函数 -->
    <script src="/js/common.js"></script>

    <!-- 学生端功能 -->
    <script src="/js/student.js"></script>

    <!-- 页面初始化脚本 -->
    <script>
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function () {
            console.log('页面DOM加载完成');

            // 更新最后更新时间
            updateLastUpdateTime();

            // 设置定时更新
            setInterval(updateLastUpdateTime, 60000); // 每分钟更新一次

            // 如果studentDashboard已初始化，更新侧边栏信息
            if (typeof studentDashboard !== 'undefined' && studentDashboard.currentUser) {
                updateSidebarInfo();
            }
        });

        // 更新最后更新时间显示
        function updateLastUpdateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastUpdateTime').textContent = timeString;
        }

        // 更新侧边栏学生信息
        function updateSidebarInfo() {
            if (studentDashboard && studentDashboard.currentUser) {
                const user = studentDashboard.currentUser;
                document.getElementById('sidebarStudentName').textContent = user.name || user.username;
                document.getElementById('sidebarStudentId').textContent = user.user_id;
            }
        }

        // 更新面包屑导航
        function updateBreadcrumb(pageName) {
            const breadcrumb = document.getElementById('breadcrumb');
            if (!breadcrumb) return;

            const pageNames = {
                'dashboard': '仪表板',
                'profile': '个人资料',
                'courses': '已选课程',
                'enrollment': '选课中心',
                'grades': '成绩查询'
            };

            breadcrumb.innerHTML = `
                <li class="breadcrumb-item"><a href="#" onclick="studentDashboard.loadPage('dashboard')">首页</a></li>
                <li class="breadcrumb-item active">${pageNames[pageName] || pageName}</li>
            `;
        }

        // 为studentDashboard添加面包屑更新功能
        if (typeof studentDashboard !== 'undefined') {
            // 保存原有的loadPage方法
            const originalLoadPage = studentDashboard.loadPage;

            // 重写loadPage方法，添加面包屑更新
            studentDashboard.loadPage = async function (page) {
                updateBreadcrumb(page);
                return originalLoadPage.call(this, page);
            };
        }

        // 兼容性：确保一些全局函数存在
        window.loadPage = function (page) {
            if (studentDashboard && typeof studentDashboard.loadPage === 'function') {
                studentDashboard.loadPage(page);
            }
        };

        window.enrollCourse = function (courseId, courseName) {
            if (studentDashboard && typeof studentDashboard.enrollCourse === 'function') {
                studentDashboard.enrollCourse(courseId, courseName);
            }
        };

        window.dropCourse = function (enrollmentId, courseName) {
            if (studentDashboard && typeof studentDashboard.dropCourse === 'function') {
                studentDashboard.dropCourse(enrollmentId, courseName);
            }
        };

        // 添加一个简单的键盘快捷键
        document.addEventListener('keydown', function (e) {
            // Alt + D: 跳转到仪表板
            if (e.altKey && e.key === 'd') {
                e.preventDefault();
                if (studentDashboard) {
                    studentDashboard.loadPage('dashboard');
                }
            }
            // Alt + P: 跳转到个人资料
            if (e.altKey && e.key === 'p') {
                e.preventDefault();
                if (studentDashboard) {
                    studentDashboard.loadPage('profile');
                }
            }
            // Alt + E: 跳转到选课中心
            if (e.altKey && e.key === 'e') {
                e.preventDefault();
                if (studentDashboard) {
                    studentDashboard.loadPage('enrollment');
                }
            }
        });

        // 页面卸载前的确认
        window.addEventListener('beforeunload', function (e) {
            // 如果页面有未保存的更改，可以在这里提示
            // 目前暂时不需要
        });
    </script>
</body>

</html>
